name: Windows build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Enable Win32 long paths
        shell: powershell
        run: |
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force

      - name: Run migration sandbox tests
        shell: powershell
        run: .\test.ps1

      - name: Build release executable
        shell: powershell
        run: .\build.ps1 -Configuration Release -OutputName CodexHomeMover.exe

      - name: Upload unsigned test build
        uses: actions/upload-artifact@v7
        with:
          name: CodexHomeMover-windows-unsigned
          if-no-files-found: error
          path: |
            dist/CodexHomeMover.exe
            dist/CodexHomeMover.exe.config
            使用说明.txt
