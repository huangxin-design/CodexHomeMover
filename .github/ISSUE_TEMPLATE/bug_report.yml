name: Bug report
description: Report a reproducible problem using redacted information only
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload `.codex`, `auth.json`, databases, full logs, or screenshots containing private paths. For security issues, use GitHub's private vulnerability reporting instead of this form.
  - type: input
    id: version
    attributes:
      label: Version
      description: Example: 0.1.0-beta.1 and the first 12 characters of the ZIP SHA-256
      placeholder: 0.1.0-beta.1 / ABCD1234...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, 64-bit
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - Startup or automatic recommendation
        - Preflight
        - Copy or verification
        - Final switch
        - Rollback to C drive
        - Delete safety backup
        - User interface
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use disposable test paths or placeholders such as C:\Users\DemoUser\.codex.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Redacted log excerpt
      description: Paste only the few relevant lines after removing user names, file names and private paths.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed account data, real user paths, private file names and task identifiers.
          required: true
